# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build the Linux environment and export it for WSL
        run: scripts/build_rootfs.sh

      # The same tests, but running inside the built environment: this is what proves the box a PC will get, libraries included.
      - name: Run the tests inside the built environment
        run: |
          VERSION="$(cat VERSION)"
          docker run --rm --user root -v "$PWD:/w" -w /w "parasync-runner:${VERSION}" sh -c "pip install -q pytest && python3 -m pytest -q tests"

      - name: The sealed-room settings are in place
        run: |
          VERSION="$(cat VERSION)"
          docker run --rm "parasync-runner:${VERSION}" sh -c 'grep -q "enabled=false" /etc/wsl.conf && grep -q "default=runner" /etc/wsl.conf && test "$(id -u)" = 1000 && ! command -v sudo'

      - uses: actions/upload-artifact@v4
        with:
          name: rootfs
          path: dist/
          retention-days: 14

      - name: Publish a release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "${TAG}" dist/* --title "${TAG#v}" --notes "Parasync local runner ${TAG#v} (Linux environment for WSL2)"
