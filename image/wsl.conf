# image/wsl.conf
# Makes this Linux box a sealed room inside Windows. Windows drives are NOT mounted (a script cannot read C:\), Windows programs
# cannot be started from inside, and the Windows PATH is not added. Scripts run as the unprivileged user "runner".
[automount]
enabled=false
mountFsTab=false

[interop]
enabled=false
appendWindowsPath=false

[user]
default=runner

[network]
generateResolvConf=true
